[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-compare-xenium-merscope"
version = "0.4.0"
description = "Standalone Napari viewer for comparing Xenium and MERSCOPE SpatialData outputs, and for viewing Atera stores"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Napari Compare contributors" }
]
dependencies = [
  "anndata>=0.12,<0.13",
  "dask[dataframe]",
  "geopandas",
  "napari[pyqt5]>=0.7.0,<0.8",
  "numpy",
  "ome-zarr",
  "packaging",
  "pandas",
  "psutil",
  "py2app; sys_platform == 'darwin'",
  "pyarrow>=15",
  "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
  "qtpy",
  "shapely",
  "scikit-image",
  "spatialdata>=0.8.0,<0.9",
  "tifffile",
  "xarray",
  "zarr>=3",
]

[project.optional-dependencies]
dev = [
  "bump-my-version>=1.3",
  "pytest",
]

[project.scripts]
napari-compare-xenium-merscope = "napari_compare_xenium_merscope.launcher:main"
napari-compare-xenium-merscope-install-macos-app = "napari_compare_xenium_merscope.launcher:install_macos_app_bundle"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
napari_compare_xenium_merscope = [
  "assets/*.icns",
  "assets/*.ico",
  "assets/*.png",
  "resources/cell_type_marker_references/*.csv",
  "resources/cell_type_marker_references/*.json",
  "resources/cell_type_marker_references/*.md",
  "resources/cellpose_annotation_runner.txt",
]

[tool.setuptools.packages.find]
where = ["src"]

# Releases (docs/versioning.md): `bump-my-version bump patch|minor|major` on a
# release branch sets the version below and turns CHANGELOG.md's [Unreleased]
# section into the release's section; `scripts/ci/changelog.py links --write`
# then rewrites the compare links. Everything else reads the installed package
# metadata, so these are the only places the number is written.
[tool.bumpversion]
current_version = "0.4.0"
parse = "(?P<major>0|[1-9]\\d*)\\.(?P<minor>0|[1-9]\\d*)\\.(?P<patch>0|[1-9]\\d*)"
serialize = ["{major}.{minor}.{patch}"]
# The release branch carries uncommitted [Unreleased] edits when bumping;
# bump-my-version neither commits nor tags here, so a dirty tree is safe.
allow_dirty = true
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = "## [Unreleased]\n\n## [{new_version}] - {now:%Y-%m-%d}"
