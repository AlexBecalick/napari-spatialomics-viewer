name: Package desktop applications
# Builds the desktop packages and publishes releases (docs/versioning.md).
#
# A release PR raises the version with bump-my-version and turns CHANGELOG.md's
# [Unreleased] section into the release's section. When it is merged into main,
# this workflow builds every platform from that commit, tags it vX.Y.Z and
# publishes a GitHub release whose notes are the release's CHANGELOG section,
# with the installers and SHA256SUMS.txt attached. A push to main whose version
# is already tagged (or has no CHANGELOG section) builds nothing.
#
# workflow_dispatch builds every platform without publishing (test builds), or,
# on main with an untagged release version, re-runs a failed release.
on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      build: ${{ steps.version.outputs.build }}
      target: ${{ steps.target.outputs.target }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Release version
        id: version
        run: |
          version="$(python3 scripts/ci/changelog.py versions)"
          mapfile -t tags < <(git tag --list 'v[0-9]*')
          status="$(python3 scripts/ci/changelog.py status --tags "${tags[@]}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          publish=false
          if [[ "$GITHUB_REF" == "refs/heads/main" && "$status" == "release" ]]; then
            publish=true
          fi
          build=false
          if [[ "$publish" == "true" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            build=true
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "build=${build}" >> "$GITHUB_OUTPUT"
          echo "Version ${version}: ${status}; publish=${publish}, build=${build}"
      - name: Check the release
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Newer than every earlier release tag, and a well-formed changelog
          # with a section for this version.
          mapfile -t tags < <(git tag --list 'v[0-9]*')
          python3 scripts/ci/changelog.py versions --newer-than-tags "${tags[@]}"
          python3 scripts/ci/changelog.py validate
          # Relative links (docs/...) would break in a release body: point them
          # at the tagged tree.
          {
            python3 scripts/ci/changelog.py notes "$VERSION" \
              --link-base "https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}"
            cat <<NOTES

          ### Downloads

          Self-contained installers include Python and the viewer dependencies:

          - macOS Apple Silicon: \`Napari-Compare-Xenium-MERSCOPE-${VERSION}-macOS-arm64.dmg\`
          - macOS Intel: \`Napari-Compare-Xenium-MERSCOPE-${VERSION}-macOS-x86_64.dmg\`
          - Windows x86-64: \`Napari-Compare-Xenium-MERSCOPE-${VERSION}-Windows-x86_64-Setup.exe\`
          - Debian/Ubuntu Linux amd64: \`napari-compare-xenium-merscope_${VERSION}_amd64.deb\`
          - \`SHA256SUMS.txt\` for verifying downloads (\`sha256sum -c SHA256SUMS.txt --ignore-missing\`).

          macOS builds are ad-hoc signed, without Apple Developer ID signing or notarization. macOS may require Gatekeeper approval to open the app.

          **Full changelog:** [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/CHANGELOG.md)
          NOTES
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Upload release notes
        if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error
      - name: Release commit
        id: target
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Build and tag the commit on main that set this version (the merged
          # release PR), also when a manual re-run starts from a later main.
          # --first-parent: a merge commit, not a release-branch commit behind it.
          target=""
          if [[ "${{ steps.version.outputs.publish }}" == "true" ]]; then
            target="$(git log -1 --first-parent --format=%H -S "version = \"${VERSION}\"" -- pyproject.toml)"
          fi
          echo "target=${target:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  macos-package:
    name: macOS ${{ matrix.architecture }} disk image
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.target }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Install build environment
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build application and disk image
        run: bash packaging/macos/build_macos.sh
      - name: Smoke-test frozen application
        run: >-
          ./dist/Napari\ Compare\ Xenium\ MERSCOPE.app/Contents/MacOS/NapariCompareXeniumMERSCOPE
          --package-smoke-test
      - uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.architecture }}-dmg
          path: artifacts/*-macOS-${{ matrix.architecture }}.dmg
          if-no-files-found: error

  windows-installer:
    name: Windows installer
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.target }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt
      - name: Install build environment
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { choco install innosetup --no-progress -y }
      - name: Build application and installer
        shell: pwsh
        run: ./packaging/windows/build_windows.ps1
      # GitHub's Windows runners do not expose the OpenGL 2.1+ context that
      # napari/VisPy requires. Exercise the frozen imports and real Qt control
      # panel here; macOS and Linux retain the full OpenGL viewer smoke test.
      - name: Smoke-test frozen Qt application
        shell: pwsh
        run: |
          $env:NAPARI_COMPARE_SMOKE_TEST_LOG = Join-Path $PWD "package-smoke-test.log"
          $process = Start-Process ".\dist\NapariCompareXeniumMERSCOPE\NapariCompareXeniumMERSCOPE.exe" -ArgumentList "--package-smoke-test", "--package-smoke-test-no-opengl" -PassThru
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            $process.WaitForExit()
            if (Test-Path $env:NAPARI_COMPARE_SMOKE_TEST_LOG) { Get-Content $env:NAPARI_COMPARE_SMOKE_TEST_LOG }
            throw "Frozen application smoke test timed out"
          }
          if (Test-Path $env:NAPARI_COMPARE_SMOKE_TEST_LOG) { Get-Content $env:NAPARI_COMPARE_SMOKE_TEST_LOG }
          if ($process.ExitCode -ne 0) { throw "Frozen application exited with $($process.ExitCode)" }
      - uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: artifacts/*-Setup.exe
          if-no-files-found: error

  linux-package:
    name: Linux package
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.target }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libfontconfig1 \
            libfreetype6 \
            libgl1 \
            libglib2.0-0 \
            libdbus-1-3 \
            libice6 \
            libsm6 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxext6 \
            libxi6 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxrender1
      - name: Install build environment
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build application and package
        run: bash packaging/linux/build_linux.sh
      - name: Verify frozen Qt libraries
        run: |
          plugin="$(find ./dist/NapariCompareXeniumMERSCOPE -name libqxcb.so -print -quit)"
          if [[ -z "$plugin" ]]; then
            echo "The frozen application does not contain the Qt xcb platform plugin." >&2
            exit 1
          fi
          ldd "$plugin"
          if ldd "$plugin" | grep -q "not found"; then
            echo "The Qt xcb platform plugin has unresolved runtime libraries." >&2
            exit 1
          fi
      - name: Smoke-test frozen application
        run: timeout 120s xvfb-run -a ./dist/NapariCompareXeniumMERSCOPE/NapariCompareXeniumMERSCOPE --package-smoke-test
      - uses: actions/upload-artifact@v6
        with:
          name: linux-deb
          path: artifacts/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub release
    # Only for a merged release PR (or a re-run of one) on main; test builds
    # stop after uploading their workflow artifacts above.
    if: needs.plan.outputs.publish == 'true'
    needs: [plan, macos-package, windows-installer, linux-package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # required to create the tag, the release and assets
    steps:
      - name: Download build artifacts and release notes
        uses: actions/download-artifact@v6
        with:
          path: dist-artifacts
      - name: Generate SHA-256 checksums
        run: |
          mv dist-artifacts/release-notes/notes.md notes.md
          rmdir dist-artifacts/release-notes
          cd dist-artifacts
          # Checksum each packaged file (dmg/exe/deb) into one SHA256SUMS.txt
          # using basenames. The subshell makes sha256sum record the basename
          # rather than the download subfolder.
          find . -type f | sort | while read -r f; do
            ( cd "$(dirname "$f")" && sha256sum "$(basename "$f")" )
          done > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
          TARGET: ${{ needs.plan.outputs.target }}
        run: |
          mapfile -t files < <(find dist-artifacts -type f | sort)
          gh release create "v${VERSION}" \
            --target "$TARGET" \
            --title "v${VERSION}" \
            --notes-file notes.md \
            --latest \
            "${files[@]}" SHA256SUMS.txt
