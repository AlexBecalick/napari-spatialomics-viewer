name: Tests
# Runs the test suite on every OS the release packages, with the same runners
# and pinned dependencies (packaging/requirements-build.txt) as
# package-desktop-apps.yml, so cross-platform breakage shows up on the PR
# instead of failing a release build.
#
# Qt runs offscreen (the test modules also default to it). -X faulthandler
# dumps every thread's stack if the interpreter crashes, which a Qt abort or a
# segfault would otherwise hide along with pytest's failure summary.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-22.04
          - name: macOS arm64
            runner: macos-15
          - name: macOS x86_64
            runner: macos-15-intel
          - name: Windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libfreetype6 \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0
      - name: Install test environment
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Run tests
        run: python -X faulthandler -m pytest -q -rfE -p no:cacheprovider
