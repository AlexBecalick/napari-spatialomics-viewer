name: napari-compare-xenium-merscope
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - conda-forge::pyopengl-accelerate=3.1.10
  - pip:
      - -e .[dev]
      # Storage-format stack. These must stay aligned with the MerXen pipeline
      # that writes the .zarr stores this viewer reads; see MerXen's
      # pyproject.toml and requirements/requirements.lock. anndata is held below
      # 0.13 because 0.13 writes zarr v3 into groups created as zarr v2, which
      # makes AnnData tables invisible to the readers here.
      - anndata>=0.12,<0.13
      - ome-zarr==0.18.0
      - spatialdata==0.8.0
      - zarr==3.1.6
      # GUI stack.
      - napari==0.7.0
      - pyqt5==5.15.11
      - qtpy==2.4.3
      # dask, geopandas, numpy, pandas, shapely and xarray are deliberately left
      # unpinned: spatialdata already constrains them, and pinning them here is
      # what previously made this file unresolvable as those constraints moved.
